<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đang chuyển hướng…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,sans-serif;background:#e9eff7;color:#1e2a3a}
  .box{text-align:center;padding:24px}
  .sp{width:36px;height:36px;border:3px solid #b9cbe6;border-top-color:#2b5797;border-radius:50%;
    margin:0 auto 14px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{margin:0;color:#64748b;font-size:14px}
</style>
<script>
(function () {
  try {
    var path = location.pathname + location.search + location.hash;
    sessionStorage.setItem("vltl_spa_path", path);
  } catch (e) {}
  var parts = location.pathname.split("/").filter(Boolean);
  var base = "/";
  if (parts.length && parts[0].toLowerCase() === "daotaokhoavltl") base = "/DaotaokhoaVLTL/";
  location.replace(base + "index.html");
})();
</script>
</head>
<body>
<div class="box"><div class="sp"></div><p>Đang mở trang…</p></div>
</body>
</html>
